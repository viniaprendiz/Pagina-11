<!DOCTYPE html>
<html lang="pt-BR">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Pagina 11 - Automação</title>
    <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 20px;
          }
          .container {
                  background: white;
                  padding: 40px;
                  border-radius: 10px;
                  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                  max-width: 500px;
                  width: 100%;
          }
          h1 { color: #333; margin-bottom: 30px; text-align: center; }
          textarea {
                  width: 100%;
                  height: 150px;
                  padding: 10px;
                  border: 1px solid #ddd;
                  border-radius: 5px;
                  font-family: monospace;
                  font-size: 14px;
                  margin-bottom: 20px;
          }
          button {
                  width: 100%;
                  padding: 12px;
                  background: #667eea;
                  color: white;
                  border: none;
                  border-radius: 5px;
                  font-size: 16px;
                  cursor: pointer;
                  margin-bottom: 10px;
          }
          button:hover { background: #764ba2; }
          #status { margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 5px; display: none; }
          .badge { display: inline-block; padding: 5px 10px; border-radius: 3px; font-size: 12px; margin-top: 10px; }
          .badge.completed { background: #4caf50; color: white; }
        </style>
  </head>
  <body>
      <div class="container">
            <h1>Automação Pagina 11</h1>
          <textarea id="dataInput" placeholder="Cole os dados do cliente aqui..."></textarea>
          <button onclick="sendData()">Enviar Ficha</button>button>
          <div id="status">
                <p><strong>Status:</strong> <span id="statusText"></span>span> <span class="badge completed">Concluído</span>span></p>
                <p><strong>CPF:</strong> <span id="cpfDisplay"></span>span></p>
                <p><strong>Nome:</strong>strong> <span id="nomeDisplay"></span>span></p>
                <button onclick="alert('Fandi: https://monitor.fandi.com.br')">Ver no Fandi</button>button>
                <button onclick="sendEmail()">Enviar Email</button>button>
          </div>div>
      </div>div>
    <script>
          async function sendData() {
                  const data = document.getElementById('dataInput').value;
                  const lines = data.trim().split('\n');
                  const cpf = lines[0];
                  const nome = lines[1];
                  const response = await fetch('/api/enviar-ficha', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ cpf, nome })
                  });
                  const result = await response.json();
                  document.getElementById('cpfDisplay').innerText = cpf;
                  document.getElementById('nomeDisplay').innerText = nome;
                  document.getElementById('statusText').innerText = 'Enviado';
                  document.getElementById('status').style.display = 'block';
          }
          async function sendEmail() {
                  const cpf = document.getElementById('cpfDisplay').innerText;
                  const nome = document.getElementById('nomeDisplay').innerText;
                  await fetch('/api/enviar-email', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ cpf, nome })
                  });
                  alert('Email enviado com sucesso!');
          }
    </script>
  </body>
</html>html>

  </body>
